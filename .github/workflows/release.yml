# Release wheels: build, smoke-test, and publish to a GitHub Release.
#
# Runs on `v*` tags (publishes) and by hand (builds and tests only, so you
# can check the pipeline without releasing). It does not publish to PyPI:
# nsh-py is experimental, and the Linux wheels (`linux_x86_64`, see
# build-wheels.yml) couldn't go there anyway. Users install with uv:
#
#   uv pip install nsh-py \
#     --find-links https://github.com/lucianosrp/nsh-py/releases/expanded_assets/<tag>
#
# Besides the release for the tag, a rolling prerelease named `latest` is
# moved to the same commit with the same files, so that URL can use the
# fixed tag `latest`.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check the tag matches Cargo.toml
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Compare versions
        run: |
          cargo_version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['package']['version'])")
          if [ "v$cargo_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $cargo_version in Cargo.toml (wheel names come from Cargo.toml)"
            exit 1
          fi

  build:
    name: Build and test
    # `check` is skipped on manual runs, which must still build.
    needs: check
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/build-wheels.yml

  publish:
    name: Publish to GitHub Releases
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -l dist

      - name: Create the release for the tag
        run: |
          flags=()
          # v1.2.3 is a release; anything else (v1.2.3rc1, v0.1.0-beta) is a prerelease.
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+(\.[0-9]+)*$ ]] || flags+=(--prerelease)
          cat > notes.md <<NOTES
          Experimental: wheels are distributed through GitHub Releases only.

          \`\`\`sh
          uv pip install nsh-py --no-index --find-links https://github.com/${GITHUB_REPOSITORY}/releases/expanded_assets/${GITHUB_REF_NAME}
          \`\`\`

          Linux wheels need the system GTK 4.14+ (Ubuntu 24.04+, Debian 13, Fedora 40+, Arch).
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* "${flags[@]}" \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes

      - name: Move the rolling `latest` prerelease
        run: |
          cat > latest-notes.md <<NOTES
          Always the newest release (currently ${GITHUB_REF_NAME}); the tag moves with each \`v*\` release.
          Use it as a fixed find-links URL:

          \`\`\`sh
          uv pip install nsh-py --no-index --find-links https://github.com/${GITHUB_REPOSITORY}/releases/expanded_assets/latest
          \`\`\`
          NOTES
          .github/scripts/rolling-release.sh latest "Latest release (${GITHUB_REF_NAME})" latest-notes.md dist/*

[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "nsh-py"
description = "Native UIs in plain Python, powered by Native Shell (NSH)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Software Development :: User Interfaces",
]

[tool.maturin]
python-source = "python"
module-name = "nsh._core"
features = []

[dependency-groups]
dev = ["maturin>=1.16,<2", "pytest>=8"]

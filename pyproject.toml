[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "nsh-py"
description = "Native UIs in plain Python, powered by Native Shell (NSH)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Topic :: Software Development :: User Interfaces",
]

[tool.maturin]
python-source = "python"
module-name = "nsh._core"
features = []

[dependency-groups]
dev = ["maturin>=1.16,<2", "pytest>=8"]

[tool.uv]
# uv run / uv sync build a dev (debug, incremental) extension: ~1-5 s per
# Rust change instead of ~23 s for release. Wheels for users are built by
# `maturin build --release` (CI), which this does not affect.
config-settings = { build-args = "--profile=dev" }
# Rebuild the extension when the Rust side changes, not only pyproject.toml.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "rust-toolchain.toml" },
    { file = "src/**/*.rs" },
]

[tool.pytest.ini_options]
# Which `nsh` the tests import is decided in tests/conftest.py.
testpaths = ["tests"]
